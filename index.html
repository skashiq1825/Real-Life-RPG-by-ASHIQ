<!DOCTYPE html>

<head>

    <title>LVLRUN</title>

<body>

    <div id="auth-screen" aria-live="polite">
       

        <div id="auth-panel" hidden>
            <div class="auth-card">
                <h1>LVLRUN</h1>
                <p class="auth-subtitle" id="auth-subtitle">Login to continue your quest</p>

                <p id="auth-error" class="auth-message auth-error" hidden></p>
                <p id="auth-success" class="auth-message auth-success" hidden></p>

                <form id="login-form" class="auth-form">
                    <label for="login-email">Email</label>
                    <input id="login-email" type="email" name="email" autocomplete="email" required>

                    <label for="login-password">Password</label>
                    <input id="login-password" type="password" name="password" autocomplete="current-password" required minlength="6">

                    <button type="submit" id="login-btn">Login</button>
                </form>

                <form id="register-form" class="auth-form" hidden>
                    <label for="register-email">Email</label>
                    <input id="register-email" type="email" name="email" autocomplete="email" required>

                    <label for="register-password">Password</label>
                    <input id="register-password" type="password" name="password" autocomplete="new-password" required minlength="6">

                    <button type="submit" id="register-btn">Register</button>
                </form>

                <button type="button" id="auth-switch-btn" class="auth-switch">
                    Need an account? Register
                </button>
            </div>
        </div>
    </div>

        <div class="default-theme">

                    <div class="lev-box">
                        <h3>1</h3>
